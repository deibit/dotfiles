# Terminal y portapapeles (OSC 52, también a través de SSH con Ghostty).
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB:clipboard'
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g mouse on
set -sg escape-time 0

# Ventanas y avisos.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g bell-action none
setw -g window-status-activity-style fg=blue
set -g set-titles on
setw -g monitor-activity on
setw -g visual-activity off
set -g automatic-rename on
set -g automatic-rename-format "#{?#{#{b:pane_current_path},==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

# Barra de estado.
set -g status-interval 1
set -g status-bg colour235
set -g status-fg colour242
setw -g window-status-current-style fg=orange
setw -g clock-mode-colour colour64
setw -g window-status-bell-style fg=colour235,bg=colour160
set -g status-left-length 30
set -g status-right-length 30
set -g status-left '#[fg=green]#h '
set -g status-right ' #[fg=cyan,bold]%H:%M #[fg=grey]%d-%b-%y'
set -g status-justify centre

# Prefijo y recarga.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'Configuration reloaded'

# C-h/j/k/l pasan a Vim/Neovim cuando el panel lo está ejecutando.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +([^[:space:]]*/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind -n C-Space if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -n S-Left previous-window
bind -n S-Right next-window

# Ventanas y divisiones en el directorio actual.
bind c new-window -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind S setw synchronize-panes
bind X confirm-before -p 'Kill window? (y/n)' kill-window
bind x kill-pane

# Copia con teclas Vim. tmux envía el contenido al terminal mediante OSC 52.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
